name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check source publication boundary
        run: python3 tools/check-source.py
      - name: Check Spanish catalog and generated source
        run: |
          python3 src/console-launcher/tools/generate-i18n.py
          git diff --exit-code -- src/console-launcher/src/i18n.c
      - name: Build and run portable daemon tests
        run: python3 tools/test-portable.py
      - name: Check ordinary-file packaging
        run: python3 src/console-packaging/tests/test_package.py
      - name: Build and test original File Explorer
        run: |
          cmake -S src/console-file-explorer -B build/file-tests -DFM_BUILD_APP=OFF -DFM_BUILD_TESTS=ON
          cmake --build build/file-tests
          ctest --test-dir build/file-tests --output-on-failure
      - name: Build managed File Explorer with SDL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-ttf-dev pkg-config
          cmake -S src/console-file-explorer -B build/file-app -DBUILD_TESTING=OFF
          cmake --build build/file-app --target console-file-explorer -j2
      - name: Check Linux library scanning
        run: |
          cmake -S src/console-sessiond -B build/library-tests -DBUILD_TESTING=ON
          cmake --build build/library-tests --target sessiond_library_linux_tests -j2
          ctest --test-dir build/library-tests -R '^library_linux$' --output-on-failure
      - name: Check Onion-compatible room and file exchange
        working-directory: src/console-onion-peer
        run: GO111MODULE=off go test .
      - name: Build Netplay input and progress programs and test localized stages
        run: python3 tools/test-netplay-panel.py
