# Install on the original read-only root image, owner root, mode 0400 or 0600.
# Replace devices/UUIDs with measured board/image values. No mmc numbering is assumed.
SYSTEM_DEVICE=/dev/disk/by-uuid/REPLACE-SYSTEM-UUID
SYSTEM_UUID=REPLACE-SYSTEM-UUID
SYSTEM_MOUNT=/opt/console
SYSTEM_TYPE=ext4
SYSTEM_OPTIONS=ro,nosuid,nodev
GAMES_DEVICE=/dev/disk/by-uuid/REPLACE-GAMES-UUID
GAMES_UUID=REPLACE-GAMES-UUID
GAMES_MOUNT=/mnt/SDCARD
GAMES_TYPE=ext4
GAMES_OPTIONS=rw,nosuid,nodev,noexec
# FAT32 requires qualified_fat_syncfs=true in matching profiles and suitable
# uid/gid/fmask/dmask mount options satisfying existing file ownership checks.
INPUT_MODULES=""
# Populate only with modules from the matching working BSP; built-in input needs none.
RUN_TMPFS_SIZE=8m
BLKID=/sbin/blkid
CONTROL_SOCKET=/run/console/control.sock
